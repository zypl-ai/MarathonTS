# Tests and the smoke test on the published results (tests/): the clone as a user gets it — without Git LFS, so the
# published tables must be plain files (a pointer fails with what to do), and the analysis must rebuild the
# published rankings and questions from them.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: tests/requirements.txt}
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest tests -v
